name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch Gita source data
        run: |
          mkdir -p /tmp/gita-data/data
          curl -sSL --retry 3 https://codeload.github.com/gita/gita/tar.gz/refs/heads/main -o /tmp/gita.tar.gz
          tar -xzf /tmp/gita.tar.gz -C /tmp/gita-data/data --strip-components=2 \
            gita-main/data/verse.json gita-main/data/translation.json
          ls -la /tmp/gita-data/data
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
